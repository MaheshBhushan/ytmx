[package]
name = "ytmx"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "YouTube Music in the terminal: a fast TUI and scriptable CLI over YouTube Music's own InnerTube API"
license = "GPL-3.0-or-later"
repository = "https://github.com/MaheshBhushan/ytmx"
readme = "README.md"
keywords = ["youtube-music", "tui", "cli", "music", "mpv"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
interprocess = { version = "2.4.7", features = ["tokio"] }
libc = "0.2.191"
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "http2"] }
rookie = "0.5.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
