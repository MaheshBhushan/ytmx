name: installers

# Run the one-line installers the way users do, against the published release.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: install.sh
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
      - run: ~/.local/bin/ytmx --version && ~/.local/bin/ytmx suggest hello | head -3 || true
      # macOS /bin/sh is bash 3.2, which in single-byte locales reads high bytes
      # as name characters ("$asset…" became the unbound variable "asset\xe2").
      - name: install.sh under bash 3.2 + Latin-1 locale
        if: runner.os == 'macOS'
        run: |
          /bin/sh --version | head -1
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh -o install.sh
          LC_ALL=en_US.ISO8859-1 LANG=en_US.ISO8859-1 YTMX_INSTALL_DIR="$RUNNER_TEMP/latin1" /bin/sh install.sh
          "$RUNNER_TEMP/latin1/ytmx" --version

  windows:
    runs-on: windows-latest
    steps:
      - name: install.ps1
        shell: pwsh
        run: irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
      - shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\ytmx\ytmx.exe" --version
          & "$env:LOCALAPPDATA\Programs\ytmx\ytmx.exe" suggest hello
